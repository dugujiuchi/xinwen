services:
  postgres:
    image: postgres:16-alpine
    container_name: news-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-newsuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme123}
      POSTGRES_DB: ${POSTGRES_DB:-news_hub}
      TZ: Asia/Shanghai
    mem_limit: 512m
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=384MB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c wal_buffers=16MB
      -c random_page_cost=1.1
      -c max_connections=30
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-newsuser} -d ${POSTGRES_DB:-news_hub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: news-api
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-newsuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme123}
      POSTGRES_DB: ${POSTGRES_DB:-news_hub}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      ENVIRONMENT: ${ENVIRONMENT:-development}
      TZ: Asia/Shanghai
    mem_limit: 256m
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  crawler:
    build:
      context: ./backend
      dockerfile: Dockerfile.crawler
    container_name: news-crawler
    init: true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-newsuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme123}
      POSTGRES_DB: ${POSTGRES_DB:-news_hub}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      TZ: Asia/Shanghai
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: news-nginx
    environment:
     TZ: Asia/Shanghai
    mem_limit: 64m
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
